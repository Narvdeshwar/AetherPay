services:
  postgres:
    image: postgres:16-alpine
    container_name: aetherpay_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aetherpay_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Envoy Edge API Gateway
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: aetherpay_envoy
    restart: always
    ports:
      - "8000:8000" # Gateway access port
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux/WSL network resolution bridge

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aetherpay_rabbitmq
    restart: always
    ports:
      - "5672:5672" # AMQP protocol port (Go connects here)
      - "15672:15672" # Web Dashboard (Browser login: guest / guest)

volumes:
  postgres_data:
  redis_data:
